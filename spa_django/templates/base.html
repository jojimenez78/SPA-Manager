<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Spa Relax</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'inicio' %}">Spa Relax</a>

        <div class="d-flex flex-wrap gap-2">
            {% if user.is_authenticated %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'crear_cita' %}">
                    Reservar cita
                </a>

                <a class="btn btn-outline-light btn-sm" href="{% url 'mis_citas' %}">
                    Mis citas
                </a>

                {% if user.is_staff %}
                    <a class="btn btn-warning btn-sm" href="{% url 'lista_servicios' %}">
                        Servicios
                    </a>

                    <a class="btn btn-warning btn-sm" href="{% url 'lista_empleados' %}">
                        Empleados
                    </a>

                    <a class="btn btn-warning btn-sm" href="{% url 'lista_citas_admin' %}">
                        Citas
                    </a>
                {% endif %}

                <span class="text-white align-self-center ms-2">
                    Hola, {{ user.username }}
                </span>

                <a class="btn btn-danger btn-sm" href="{% url 'logout' %}">
                    Salir
                </a>
            {% else %}
                <a class="btn btn-success btn-sm" href="{% url 'login' %}">
                    Login
                </a>

                <a class="btn btn-primary btn-sm" href="{% url 'registro' %}">
                    Registro
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
