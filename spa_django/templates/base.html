<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Spa Relax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Spa Relax</a>
            <div>
                {% if user.is_authenticated %}
                    <span class="text-white me-3">Hola {{ user.username }}</span>
                    <a class="btn btn-outline-light btn-sm" href="/accounts/logout/">Salir</a>
                {% else %}
                    <a class="btn btn-outline-light btn-sm me-2" href="/accounts/login/">Entrar</a>
                    <a class="btn btn-light btn-sm" href="/usuarios/registro/">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
