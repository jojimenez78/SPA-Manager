{% extends 'base.html' %}

{% block content %}
<h2>{% if servicio %}Editar servicio{% else %}Nuevo servicio{% endif %}</h2>

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" value="{{ servicio.nombre|default:'' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion" class="form-control" required>{{ servicio.descripcion|default:'' }}</textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Duración en minutos</label>
        <input type="number" name="duracion_minutos" class="form-control" value="{{ servicio.duracion_minutos|default:'' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Precio</label>
        <input type="number" step="0.01" name="precio" class="form-control" value="{{ servicio.precio|default:'' }}" required>
    </div>

    <div class="form-check mb-3">
        <input type="checkbox" name="activo" class="form-check-input" {% if servicio.activo or not servicio %}checked{% endif %}>
        <label class="form-check-label">Activo</label>
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'lista_servicios' %}" class="btn btn-secondary">Volver</a>
</form>
{% endblock %}
