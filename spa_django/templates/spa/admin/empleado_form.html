{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{% if empleado %}Editar empleado{% else %}Nuevo empleado{% endif %}</h2>

    <form method="post" class="mt-3">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input
                type="text"
                name="nombre"
                class="form-control"
                value="{{ empleado.nombre|default:'' }}"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Especialidad</label>
            <input
                type="text"
                name="especialidad"
                class="form-control"
                value="{{ empleado.especialidad|default:'' }}"
                required
            >
        </div>

        <div class="form-check mb-3">
            <input
                type="checkbox"
                name="activo"
                class="form-check-input"
                {% if empleado.activo or not empleado %}checked{% endif %}
            >
            <label class="form-check-label">Activo</label>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'lista_empleados' %}" class="btn btn-secondary">Volver</a>
    </form>
</div>
{% endblock %}
