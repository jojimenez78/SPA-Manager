{% extends 'base.html' %}

{% block content %}
<div class="spa-card form-card">
    <div class="mb-4 text-center">
        <h2 class="page-title">Registro de usuario</h2>
        <p class="text-muted mb-0">
            Crea tu cuenta para reservar citas y administrar tu experiencia en el spa.
        </p>
    </div>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="d-grid gap-2 mt-4">
            <button class="btn btn-spa-primary">Registrarse</button>
            <a href="{% url 'login' %}" class="btn btn-soft">Ya tengo cuenta</a>
        </div>
    </form>
</div>
{% endblock %}
